name: blindly_dating_app
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: "none" # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
version: 1.0.0+1

environment:
  sdk: ^3.10.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  country_code_picker: ^3.0.0

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^17.0.1

  # Backend & Auth
  supabase_flutter: ^2.12.0
  firebase_core: ^4.5.0
  firebase_messaging: ^16.1.2
  firebase_app_check: ^0.4.1+4
  http: ^1.6.0

  # Utils
  fpdart: ^1.1.0
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1
  intl: ^0.20.2
  uuid: ^4.3.3

  # UI/Icons
  cupertino_icons: ^1.0.8
  sentry_flutter: ^9.10.0
  flutter_secure_storage: ^10.0.0
  google_fonts: ^8.0.0
  flutter_dotenv: ^6.0.0
  url_launcher: ^6.3.2
  safe_device: ^1.1.4
  dart_jsonwebtoken: 3.1.1
  shared_preferences: ^2.5.4
  google_sign_in: ^7.2.0
  font_awesome_flutter: ^10.12.0
  geolocator: ^14.0.1
  permission_handler: ^12.0.1
  image_picker: ^1.2.1
  flutter_image_compress: ^2.4.0
  image_cropper: ^11.0.0
  reorderable_grid_view: ^2.2.8
  agora_rtc_engine: ^6.3.0

  # ✅ ADDED: UI Component for Swipe Deck (Moved from dev_dependencies to here)
  flutter_card_swiper: ^7.2.0
  flutter_cache_manager: ^3.3.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Audio
  record: ^6.1.2
  audioplayers: ^6.0.0
  path_provider: ^2.1.5

  # Camera & ML Kit (Kept from your original file)
  camera: ^0.11.3
  google_mlkit_pose_detection: ^0.14.0
  google_mlkit_translation: ^0.13.0
  google_mlkit_language_id: ^0.13.0
  veriff_flutter: ^5.4.0
  cached_network_image: ^3.4.1

  # intl: ^0.19.0
  swipe_to: ^1.0.6
  timeago: ^3.7.1
  flutter_local_notifications: ^17.0.0
  share_plus: ^12.0.1
  app_links: ^6.4.1

  #encryption
  encrypt: ^5.0.3
  pointycastle: ^3.6.2
  asn1lib: ^1.5.0
  basic_utils: ^5.7.0
  supabase: ^2.10.4
 # flutter_secure_storage: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.8
  riverpod_generator: ^2.4.0
  freezed: ^2.4.7
  json_serializable: ^6.7.1
  flutter_launcher_icons: ^0.14.3
  mocktail: ^1.0.4
  hive_generator: ^2.0.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/blindly-app-icon-color.jpg"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/images/blindly-app-icon-color.jpg"
    background_color: "#hex_code"
    theme_color: "#hex_code"
  windows:
    generate: true
    image_path: "assets/images/blindly-app-icon-color.jpg"
    icon_size: 48
  macos:
    generate: true
    image_path: "assets/images/blindly-app-icon-color.jpg"

dependency_overrides:
  fluttertoast: ^8.2.9

flutter:
  uses-material-design: true
  generate: true # gen_l10n — see l10n.yaml

  assets:
    - .env.development
    - .env.production
    - assets/images/
    - assets/icons/
    - assets/static/
    - assets/defaults/
    - assets/moderation/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter/static/Inter_28pt-Regular.ttf

    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins/Poppins-Regular.ttf
