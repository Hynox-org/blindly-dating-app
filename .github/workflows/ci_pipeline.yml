name: Blindly CI Pipeline

on:
  push:
    branches: [dev-main]
  pull_request:
    branches: [dev-main]

jobs:
  flutter_ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          # flutter-version: '3.x.x' # Define version if needed

      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Build Debug APK
        run: flutter build apk --debug
